name: CI

on:
  push:
    branches: [main, phase-3-iphone-local-ai, phase-4a-windows-product-host]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  windows-host-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend / Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Generate CrownKeep desktop icons
        run: npm run desktop:prepare

      - name: Check CrownKeep Tauri host
        run: cargo check --manifest-path src-tauri/Cargo.toml
