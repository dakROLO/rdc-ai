<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CrownKeep sprint roadmap</title>
  <desc id="desc">A branded roadmap showing completed, active, next, and planned CrownKeep sprints from foundation through local AI, encrypted sync, cloud escalation, hardening, and future context integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081311"/>
      <stop offset="1" stop-color="#0F1F1E"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12352F"/>
      <stop offset="1" stop-color="#0F2622"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 46px Inter,Segoe UI,Arial,sans-serif; fill:#E8E4DA; letter-spacing:-1px; }
      .subtitle { font: 400 21px Inter,Segoe UI,Arial,sans-serif; fill:#91A59F; }
      .phase { font: 700 22px Inter,Segoe UI,Arial,sans-serif; fill:#E8E4DA; }
      .phaseNo { font: 800 14px Inter,Segoe UI,Arial,sans-serif; fill:#2EE6B8; letter-spacing:1.6px; }
      .sprint { font: 600 16px Inter,Segoe UI,Arial,sans-serif; fill:#E8E4DA; }
      .small { font: 400 13px Inter,Segoe UI,Arial,sans-serif; fill:#91A59F; }
      .badge { font: 800 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing:1px; }
      .footer { font: 500 14px Inter,Segoe UI,Arial,sans-serif; fill:#91A59F; }
      .line { stroke:#23453F; stroke-width:2; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="36" fill="url(#bg)"/>
  <circle cx="1380" cy="-40" r="360" fill="#115E4F" opacity=".10"/>
  <circle cx="160" cy="1080" r="300" fill="#C97F5B" opacity=".07"/>

  <!-- compact CrownKeep mark -->
  <g transform="translate(70 58)">
    <rect width="86" height="86" rx="24" fill="#0B1716" stroke="#2EE6B8" stroke-width="5"/>
    <rect x="13" y="13" width="60" height="60" rx="17" fill="none" stroke="#115E4F" stroke-width="5"/>
    <path d="M25 33 L34 23 L43 31 L52 23 L61 33 L61 39 L25 39 Z" fill="#E8E4DA"/>
    <path d="M27 39 H59 V61 Q59 66 54 66 H32 Q27 66 27 61 Z" fill="none" stroke="#2EE6B8" stroke-width="5"/>
    <circle cx="43" cy="47" r="2.8" fill="#C97F5B"/>
  </g>

  <text x="180" y="91" class="title">CrownKeep Sprint Roadmap</text>
  <text x="180" y="126" class="subtitle">Private by default. Powerful by choice.</text>

  <g transform="translate(1180 58)">
    <rect width="330" height="78" rx="20" fill="#102925" stroke="#2EE6B8" stroke-opacity=".34"/>
    <text x="22" y="30" class="phaseNo">CURRENT BUILD</text>
    <text x="22" y="57" class="phase">Sprint 2.1 · Foundry Local</text>
    <circle cx="304" cy="39" r="8" fill="#2EE6B8" filter="url(#softGlow)"/>
  </g>

  <!-- legend -->
  <g transform="translate(70 164)">
    <circle cx="8" cy="8" r="7" fill="#2EE6B8"/><text x="24" y="13" class="small">Complete</text>
    <circle cx="128" cy="8" r="7" fill="#C97F5B"/><text x="144" y="13" class="small">Active</text>
    <circle cx="226" cy="8" r="7" fill="#E8E4DA"/><text x="242" y="13" class="small">Next</text>
    <circle cx="307" cy="8" r="7" fill="#56736C"/><text x="323" y="13" class="small">Planned</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(70 210)">
    <rect width="455" height="225" rx="24" fill="#0E221F" stroke="#23453F"/>
    <text x="24" y="34" class="phaseNo">PHASE 0</text>
    <text x="24" y="66" class="phase">Foundation</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#2EE6B8"/>
    <text x="52" y="121" class="sprint">0.1 · Repo + project context</text>
    <text x="52" y="143" class="small">Durable docs, architecture, security, CI</text>
    <circle cx="34" cy="173" r="6" fill="#E8E4DA"/>
    <text x="52" y="179" class="sprint">0.2 · App shell + PWA</text>
    <text x="52" y="201" class="small">Build complete · install validation remains</text>
  </g>

  <g transform="translate(572 210)">
    <rect width="455" height="225" rx="24" fill="#0E221F" stroke="#23453F"/>
    <text x="24" y="34" class="phaseNo">PHASE 1</text>
    <text x="24" y="66" class="phase">Local Conversation Core</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#2EE6B8"/>
    <text x="52" y="121" class="sprint">1.1 · Local persistence</text>
    <text x="52" y="143" class="small">IndexedDB · create/open/rename/delete</text>
    <circle cx="34" cy="173" r="6" fill="#2EE6B8"/>
    <text x="52" y="179" class="sprint">1.2 · Provider-neutral chat</text>
    <text x="52" y="201" class="small">Streaming · cancel · provider/model metadata</text>
  </g>

  <g transform="translate(1074 210)">
    <rect width="455" height="225" rx="24" fill="url(#activeCard)" stroke="#C97F5B" stroke-width="2"/>
    <text x="24" y="34" class="phaseNo">PHASE 2</text>
    <text x="24" y="66" class="phase">Windows Local AI</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="7" fill="#C97F5B"/>
    <text x="52" y="121" class="sprint">2.1 · Foundry Local connectivity</text>
    <text x="52" y="143" class="small">Live Phi inference working on-device</text>
    <circle cx="34" cy="173" r="6" fill="#E8E4DA"/>
    <text x="52" y="179" class="sprint">2.2 · Windows hardening</text>
    <text x="52" y="201" class="small">Runtime lifecycle · UX · install experience</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(70 467)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 3</text>
    <text x="24" y="66" class="phase">iPhone Local AI</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#56736C"/>
    <text x="52" y="121" class="sprint">3.1 · Capability + model lifecycle</text>
    <text x="52" y="143" class="small">Detect device support · cache local model</text>
    <circle cx="34" cy="173" r="6" fill="#56736C"/>
    <text x="52" y="179" class="sprint">3.2 · Mobile local conversation</text>
    <text x="52" y="201" class="small">Anne runs on the phone, not the laptop</text>
  </g>

  <g transform="translate(572 467)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 4</text>
    <text x="24" y="66" class="phase">Cloud Identity + API</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#56736C"/>
    <text x="52" y="121" class="sprint">4.1 · Microsoft Entra ID</text>
    <text x="52" y="143" class="small">Cloud auth without blocking local use</text>
    <circle cx="34" cy="173" r="6" fill="#56736C"/>
    <text x="52" y="179" class="sprint">4.2 · Minimal Azure API</text>
    <text x="52" y="201" class="small">Protected CrownKeep cloud boundary</text>
  </g>

  <g transform="translate(1074 467)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 5</text>
    <text x="24" y="66" class="phase">Encrypted Cross-Device Sync</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="112" r="6" fill="#56736C"/>
    <text x="52" y="118" class="sprint">5.1 · Protocol + key design</text>
    <circle cx="34" cy="153" r="6" fill="#56736C"/>
    <text x="52" y="159" class="sprint">5.2 · Encrypted Azure sync</text>
    <circle cx="34" cy="194" r="6" fill="#56736C"/>
    <text x="52" y="200" class="sprint">5.3 · Conflict + recovery UX</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(70 724)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 6</text>
    <text x="24" y="66" class="phase">Explicit Cloud Escalation</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#56736C"/>
    <text x="52" y="121" class="sprint">6.1 · CrownKeep cloud provider</text>
    <text x="52" y="143" class="small">Server-held credentials · explicit provider</text>
    <circle cx="34" cy="173" r="6" fill="#56736C"/>
    <text x="52" y="179" class="sprint">6.2 · Open / Return to the Keep</text>
    <text x="52" y="201" class="small">One conversation across local and cloud</text>
  </g>

  <g transform="translate(572 724)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 7</text>
    <text x="24" y="66" class="phase">Product Hardening</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#56736C"/>
    <text x="52" y="121" class="sprint">7.1 · Reliability + security</text>
    <text x="52" y="143" class="small">Tests · CSP · privacy-safe diagnostics</text>
    <circle cx="34" cy="173" r="6" fill="#56736C"/>
    <text x="52" y="179" class="sprint">7.2 · Install + release workflow</text>
    <text x="52" y="201" class="small">Repeatable Windows + iPhone delivery</text>
  </g>

  <g transform="translate(1074 724)">
    <rect width="455" height="225" rx="24" fill="#0C1D1A" stroke="#1C3833"/>
    <text x="24" y="34" class="phaseNo">PHASE 8</text>
    <text x="24" y="66" class="phase">Future Context Contract</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="116" r="6" fill="#56736C"/>
    <text x="52" y="122" class="sprint">8.1 · ContextProvider contract</text>
    <text x="52" y="146" class="small">Synthetic context only</text>
    <text x="52" y="178" class="small">No live RDC customer / Blueprint /</text>
    <text x="52" y="198" class="small">dashboard connection in this roadmap.</text>
  </g>

  <text x="70" y="1002" class="footer">Visual summary only · docs/ROADMAP.md remains the detailed source of truth.</text>
  <text x="1528" y="1002" text-anchor="end" class="footer">CrownKeep · Anne · 2026-09-25</text>
</svg>