<style>
.title{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#EEF6FF}.sub{font:400 21px 'Segoe UI',Arial,sans-serif;fill:#AAC0DA}.label{font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}.head{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#EEF6FF}.body{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#BDD0E5}.gate{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#EEF6FF}.foot{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#AAC0DA}
</style></defs>
