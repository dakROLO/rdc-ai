<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CrownKeep sprint roadmap</title>
  <desc id="desc">A branded roadmap showing completed, active, next, and planned CrownKeep sprints from foundation through local AI, encrypted sync, cloud escalation, hardening, and future context integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030916"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2B54"/>
      <stop offset="1" stop-color="#081C36"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 46px Inter,Segoe UI,Arial,sans-serif; fill:#EEF6FF; letter-spacing:-1px; }
      .subtitle { font: 400 21px Inter,Segoe UI,Arial,sans-serif; fill:#91A7C0; }
      .phase { font: 700 22px Inter,Segoe UI,Arial,sans-serif; fill:#EEF6FF; }
      .phaseNo { font: 800 14px Inter,Segoe UI,Arial,sans-serif; fill:#38D8FF; letter-spacing:1.6px; }
      .sprint { font: 600 16px Inter,Segoe UI,Arial,sans-serif; fill:#EEF6FF; }
      .small { font: 400 13px Inter,Segoe UI,Arial,sans-serif; fill:#91A7C0; }
      .badge { font: 800 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing:1px; }
      .footer { font: 500 14px Inter,Segoe UI,Arial,sans-serif; fill:#91A7C0; }
      .line { stroke:#163758; stroke-width:2; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="36" fill="url(#bg)"/>
  <circle cx="1380" cy="-40" r="360" fill="#1558D6" opacity=".10"/>
  <circle cx="160" cy="1080" r="300" fill="#D49467" opacity=".07"/>

  <!-- compact CrownKeep facelift mark -->
  <g transform="translate(70 58)">
    <rect width="86" height="86" rx="24" fill="#071426" stroke="#38D8FF" stroke-opacity=".16" stroke-width="2"/>
    <path d="M64 23 A29 29 0 1 0 64 63" fill="none" stroke="#38D8FF" stroke-width="8" stroke-linecap="round"/>
    <path d="M29 45 L35 32 L43 40 L51 32 L58 45 L55 52 H32 Z" fill="none" stroke="#EEF6FF" stroke-width="4" stroke-linejoin="round"/>
    <line x1="34" y1="58" x2="54" y2="58" stroke="#38D8FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="44" cy="58" r="2.5" fill="#D49467"/>
  </g>

  <text x="180" y="91" class="title">CrownKeep Sprint Roadmap</text>
  <text x="180" y="126" class="subtitle">Private by default. Powerful by choice.</text>

  <g transform="translate(1180 58)">
    <rect width="330" height="78" rx="20" fill="#0A1D36" stroke="#38D8FF" stroke-opacity=".34"/>
    <text x="22" y="30" class="phaseNo">CURRENT TEST</text>
    <text x="22" y="57" class="phase">iPhone · Web + retained context</text>
    <circle cx="304" cy="39" r="8" fill="#38D8FF" filter="url(#softGlow)"/>
  </g>

  <!-- legend -->
  <g transform="translate(70 164)">
    <circle cx="8" cy="8" r="7" fill="#38D8FF"/><text x="24" y="13" class="small">Complete</text>
    <circle cx="128" cy="8" r="7" fill="#D49467"/><text x="144" y="13" class="small">Active</text>
    <circle cx="226" cy="8" r="7" fill="#EEF6FF"/><text x="242" y="13" class="small">Next</text>
    <circle cx="307" cy="8" r="7" fill="#5D7694"/><text x="323" y="13" class="small">Planned</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(70 210)">
    <rect width="455" height="225" rx="24" fill="#08182C" stroke="#163758"/>
    <text x="24" y="34" class="phaseNo">PHASE 0</text>
    <text x="24" y="66" class="phase">Foundation</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#38D8FF"/>
    <text x="52" y="121" class="sprint">0.1 · Repo + project context</text>
    <text x="52" y="143" class="small">Durable docs, architecture, security, CI</text>
    <circle cx="34" cy="173" r="7" fill="#D49467"/>
    <text x="52" y="179" class="sprint">0.2 · App shell + PWA</text>
    <text x="52" y="201" class="small">Build complete · install validation remains</text>
  </g>

  <g transform="translate(572 210)">
    <rect width="455" height="225" rx="24" fill="#08182C" stroke="#163758"/>
    <text x="24" y="34" class="phaseNo">PHASE 1</text>
    <text x="24" y="66" class="phase">Local Conversation Core</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#38D8FF"/>
    <text x="52" y="121" class="sprint">1.1 · Local persistence</text>
    <text x="52" y="143" class="small">IndexedDB · create/open/rename/delete</text>
    <circle cx="34" cy="173" r="6" fill="#38D8FF"/>
    <text x="52" y="179" class="sprint">1.2 · Provider-neutral chat</text>
    <text x="52" y="201" class="small">Streaming · cancel · provider/model metadata</text>
  </g>

  <g transform="translate(1074 210)">
    <rect width="455" height="225" rx="24" fill="#08182C" stroke="#163758"/>
    <text x="24" y="34" class="phaseNo">PHASE 2</text>
    <text x="24" y="66" class="phase">Windows Local AI</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#38D8FF"/>
    <text x="52" y="121" class="sprint">2.1 · Foundry Local connectivity</text>
    <text x="52" y="143" class="small">Foundry validated across Windows hosts</text>
    <circle cx="34" cy="173" r="6" fill="#38D8FF"/>
    <text x="52" y="179" class="sprint">2.2 · Windows hardening</text>
    <text x="52" y="201" class="small">Diagnostics · runtime UX · first-run setup</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(70 467)">
    <rect width="455" height="225" rx="24" fill="url(#activeCard)" stroke="#D49467" stroke-width="2"/>
    <text x="24" y="34" class="phaseNo">PHASE 3</text>
    <text x="24" y="66" class="phase">iPhone Local AI</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="108" r="6" fill="#38D8FF"/>
    <text x="52" y="114" class="sprint">3.1 · Native Apple capability + host</text>
    <circle cx="34" cy="145" r="6" fill="#38D8FF"/>
    <text x="52" y="151" class="sprint">3.2 · Mobile local conversation</text>
    <circle cx="34" cy="184" r="7" fill="#D49467"/>
    <text x="52" y="190" class="sprint">Current · Web + retained context</text>
    <text x="52" y="212" class="small">Rolo15 physical acceptance + polish</text>
  </g>

  <g transform="translate(572 467)">
    <rect width="455" height="225" rx="24" fill="#08182C" stroke="#38D8FF" stroke-width="2"/>
    <text x="24" y="34" class="phaseNo">PHASE 4A</text>
    <text x="24" y="66" class="phase">Local Platform Convergence</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="108" r="6" fill="#38D8FF"/>
    <text x="52" y="114" class="sprint">4A.3 · Shared local platform</text>
    <circle cx="34" cy="143" r="6" fill="#38D8FF"/>
    <text x="52" y="149" class="sprint">4A.4 · System Foundry + keyless web</text>
    <circle cx="34" cy="178" r="6" fill="#EEF6FF"/>
    <text x="52" y="184" class="sprint">4A.5 · Installer + stable storage</text>
    <circle cx="34" cy="211" r="6" fill="#5D7694"/>
    <text x="52" y="217" class="small">4A.6 · Tools + image/multimodal proof</text>
  </g>

  <g transform="translate(1074 467)">
    <rect width="455" height="225" rx="24" fill="#061426" stroke="#102A4B"/>
    <text x="24" y="34" class="phaseNo">PHASE 4B</text>
    <text x="24" y="66" class="phase">Cloud Identity + API</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#5D7694"/>
    <text x="52" y="121" class="sprint">4B.1 · Microsoft Entra ID</text>
    <text x="52" y="143" class="small">Cloud auth never blocks local use</text>
    <circle cx="34" cy="173" r="6" fill="#5D7694"/>
    <text x="52" y="179" class="sprint">4B.2 · Minimal Azure API</text>
    <text x="52" y="201" class="small">Protected CrownKeep cloud boundary</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(70 724)">
    <rect width="455" height="225" rx="24" fill="#061426" stroke="#102A4B"/>
    <text x="24" y="34" class="phaseNo">PHASE 5</text>
    <text x="24" y="66" class="phase">Encrypted Cross-Device Sync</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="112" r="6" fill="#5D7694"/>
    <text x="52" y="118" class="sprint">5.1 · Protocol + key design</text>
    <circle cx="34" cy="153" r="6" fill="#5D7694"/>
    <text x="52" y="159" class="sprint">5.2 · Encrypted Azure sync</text>
    <circle cx="34" cy="194" r="6" fill="#5D7694"/>
    <text x="52" y="200" class="sprint">5.3 · Conflict + recovery UX</text>
  </g>

  <g transform="translate(572 724)">
    <rect width="455" height="225" rx="24" fill="#061426" stroke="#102A4B"/>
    <text x="24" y="34" class="phaseNo">PHASE 6</text>
    <text x="24" y="66" class="phase">Explicit Cloud Escalation</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#5D7694"/>
    <text x="52" y="121" class="sprint">6.1 · CrownKeep cloud provider</text>
    <text x="52" y="143" class="small">Server-held credentials · explicit provider</text>
    <circle cx="34" cy="173" r="6" fill="#5D7694"/>
    <text x="52" y="179" class="sprint">6.2 · Take to Cloud / Return Local</text>
    <text x="52" y="201" class="small">One conversation across local and cloud</text>
  </g>

  <g transform="translate(1074 724)">
    <rect width="455" height="225" rx="24" fill="#061426" stroke="#102A4B"/>
    <text x="24" y="34" class="phaseNo">PHASES 7–8</text>
    <text x="24" y="66" class="phase">Harden + Extend Context</text>
    <line x1="24" y1="84" x2="431" y2="84" class="line"/>
    <circle cx="34" cy="115" r="6" fill="#5D7694"/>
    <text x="52" y="121" class="sprint">7.x · Reliability + release</text>
    <text x="52" y="143" class="small">Security · testing · normal-user delivery</text>
    <circle cx="34" cy="173" r="6" fill="#5D7694"/>
    <text x="52" y="179" class="sprint">8.1 · ContextProvider contract</text>
    <text x="52" y="201" class="small">RDC remains an optional configured source</text>
  </g>

  <text x="70" y="1002" class="footer">Visual summary only · docs/ROADMAP.md remains the detailed source of truth.</text>
  <text x="1528" y="1002" text-anchor="end" class="footer">CrownKeep · Anne · 2026-09-28</text>
</svg>